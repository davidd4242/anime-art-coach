name: Windows portable smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-portable.yml"
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download and verify the published x64 package
        shell: pwsh
        run: |
          $url = "https://github.com/davidd4242/anime-art-coach/releases/download/v1.0.1/anime-art-coach-windows-x64.zip"
          curl.exe --fail --location --retry 3 $url -o portable.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash portable.zip).Hash -ne "6EC6AA14A638C21F7293CFBD89FEF6E8E78581D5C0F2BEFD8361CAF52CED4447") { throw "Archive digest mismatch" }
          Expand-Archive portable.zip -DestinationPath unpacked
      - name: Run the embedded interpreter on both pipelines
        shell: pwsh
        working-directory: unpacked/anime-art-coach-windows-x64
        run: |
          & .\runtime\python.exe -B -X utf8 .\windows\verify.py
          exit $LASTEXITCODE
